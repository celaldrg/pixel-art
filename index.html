<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Art Editor</title>
  <meta name="description" content="Draw pixel art in the browser: pencil, eraser, flood fill, lines, rectangles, mirror drawing, palettes, undo/redo, PNG export and autosave. Works with mouse, pen and touch.">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pixel Art Editor">
  <meta property="og:description" content="A small pixel art editor in the browser with fill, lines, rectangles, mirror drawing, undo/redo, PNG export and autosave.">
  <meta property="og:url" content="https://celaldrg.github.io/pixel-art/">
  <meta property="og:image" content="https://celaldrg.github.io/pixel-art/docs/screenshot.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23fb923c' d='M2 0h4v1H2zM1 1h6v1H1zM0 2h8v3H0z'/%3E%3Cpath fill='%23f4f1e8' d='M3 1h1v1H3zM6 2h1v1H6zM1 3h1v1H1zM2 5h4v3H2z'/%3E%3Cpath fill='%236b3d2b' d='M3 6h2v2H3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3M5 16l3 3"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M13.5 5.5l5 5-10 10-5-5z"/><path d="M8 11l5 5M14 20.5h6"/></symbol>
    <symbol id="i-fill" viewBox="0 0 24 24"><path d="M4 12h14l-7 7z" fill="currentColor" fill-opacity=".35" stroke="none"/><path d="M4 12l7-7 7 7-7 7z"/><path d="M8.5 7.5L6 5"/><path d="M20 14.5c.9 1.2 1.5 2.1 1.5 2.9a1.5 1.5 0 0 1-3 0c0-.8.6-1.7 1.5-2.9z"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M8 16l8-8"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></symbol>
    <symbol id="i-picker" viewBox="0 0 24 24"><path d="M4 20l1-3 8-8 2 2-8 8z"/><path d="M11.5 7.5l5 5"/><path d="M14 6l1.5-1.5a2.1 2.1 0 0 1 3 0l1 1a2.1 2.1 0 0 1 0 3L18 10"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-mirror-h" viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M9 7L3 17h6z"/><path d="M15 7l6 10h-6z"/></symbol>
    <symbol id="i-mirror-v" viewBox="0 0 24 24"><path d="M3 12h18" stroke-dasharray="2 3"/><path d="M7 9L17 3v6z"/><path d="M7 15l10 6v-6z"/></symbol>
    <symbol id="i-filled" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5" fill="currentColor" fill-opacity=".45"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8M7.5 10.5h6M10.5 7.5v6"/></symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8M7.5 10.5h6"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
        <path fill="#fb923c" d="M2 0h4v1H2zM1 1h6v1H1zM0 2h8v3H0z"/>
        <path fill="#f4f1e8" d="M3 1h1v1H3zM6 2h1v1H6zM1 3h1v1H1zM2 5h4v3H2z"/>
        <path fill="#6b3d2b" d="M3 6h2v2H3z"/>
      </svg>
      <h1 data-i18n="app.title">Pixel Art Editor</h1>
    </div>
    <div class="topbar-actions">
      <button id="clear-btn" class="btn" type="button" data-i18n-tip="tip.clear">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-trash"/></svg>
        <span class="btn-text" data-i18n="action.clear">Clear</span>
      </button>
      <button id="lang-btn" class="btn btn-lang" type="button" lang="tr" data-i18n="lang.code" data-i18n-tip="lang.toggle">TR</button>
    </div>
  </header>

  <main class="editor">
    <div class="toolbar" role="toolbar" data-i18n-aria="toolbar.label">
      <div class="tool-group">
        <button class="tool" type="button" data-tool="pencil" data-shortcut="B" data-i18n-tip="tool.pencil" aria-pressed="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pencil"/></svg></button>
        <button class="tool" type="button" data-tool="eraser" data-shortcut="E" data-i18n-tip="tool.eraser" aria-pressed="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-eraser"/></svg></button>
        <button class="tool" type="button" data-tool="fill" data-shortcut="G" data-i18n-tip="tool.fill" aria-pressed="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-fill"/></svg></button>
        <button class="tool" type="button" data-tool="line" data-shortcut="L" data-i18n-tip="tool.line" aria-pressed="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-line"/></svg></button>
        <button class="tool" type="button" data-tool="rect" data-shortcut="R" data-i18n-tip="tool.rect" aria-pressed="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-rect"/></svg></button>
        <button class="tool" type="button" data-tool="picker" data-shortcut="I" data-i18n-tip="tool.picker" aria-pressed="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-picker"/></svg></button>
      </div>
      <div class="tool-group">
        <button id="undo-btn" class="tool" type="button" data-shortcut="Ctrl+Z" data-i18n-tip="action.undo" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-undo"/></svg></button>
        <button id="redo-btn" class="tool" type="button" data-shortcut="Ctrl+Y" data-i18n-tip="action.redo" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-redo"/></svg></button>
      </div>
    </div>

    <section class="workspace">
      <div class="stage">
        <canvas id="canvas" role="img" data-i18n-aria="canvas.label"></canvas>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </div>
      <div class="stage-bar">
        <div class="tool-group">
          <button id="mirror-h-btn" class="tool toggle" type="button" data-i18n-tip="option.mirrorH" aria-pressed="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-mirror-h"/></svg></button>
          <button id="mirror-v-btn" class="tool toggle" type="button" data-i18n-tip="option.mirrorV" aria-pressed="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-mirror-v"/></svg></button>
          <button id="filled-btn" class="tool toggle" type="button" data-i18n-tip="option.filled" aria-pressed="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-filled"/></svg></button>
          <button id="grid-btn" class="tool toggle" type="button" data-i18n-tip="option.grid" aria-pressed="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-grid"/></svg></button>
        </div>
        <div class="tool-group">
          <button id="zoom-out-btn" class="tool" type="button" data-i18n-tip="zoom.out"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-zoom-out"/></svg></button>
          <button id="fit-btn" class="tool tool-wide" type="button" data-i18n-tip="zoom.fit"><svg class="icon icon-small" aria-hidden="true" focusable="false"><use href="#i-fit"/></svg><span id="zoom-label" class="zoom-label">1×</span></button>
          <button id="zoom-in-btn" class="tool" type="button" data-i18n-tip="zoom.in"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-zoom-in"/></svg></button>
        </div>
      </div>
      <div class="status-bar">
        <span id="coords" class="coords"></span>
        <span id="hint" class="hint"></span>
        <span id="save-status" class="save-status" role="status"></span>
      </div>
    </section>

    <aside class="sidebar">
      <section class="panel color-panel">
        <div class="panel-head">
          <div class="current-color">
            <span id="current-swatch" class="current-swatch"></span>
            <div class="current-text">
              <h2 class="panel-title" data-i18n="panel.color">Color</h2>
              <code id="current-hex" class="current-hex"></code>
            </div>
          </div>
          <select id="palette-select" class="select" data-i18n-aria="panel.palette"></select>
        </div>
        <div id="palette-swatches" class="swatches" role="group" data-i18n-aria="panel.palette"></div>
        <div class="panel-head panel-head-sub">
          <h2 class="panel-title" data-i18n="panel.custom">Custom colors</h2>
          <label class="btn btn-small add-color">
            <svg class="icon icon-small" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg>
            <span data-i18n="custom.add">Add color</span>
            <input id="color-input" type="color" value="#fb923c">
          </label>
        </div>
        <div id="custom-swatches" class="swatches" role="group" data-i18n-aria="panel.custom"></div>
        <p id="custom-empty" class="empty-note" data-i18n="custom.empty">Colors you add show up here.</p>
      </section>

      <section class="panel">
        <h2 class="panel-title" data-i18n="panel.preview">Preview</h2>
        <div class="previews">
          <figure class="preview-item">
            <canvas id="preview-1x" class="preview"></canvas>
            <figcaption>1×</figcaption>
          </figure>
          <figure class="preview-item">
            <canvas id="preview-2x" class="preview"></canvas>
            <figcaption>2×</figcaption>
          </figure>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title" data-i18n="panel.canvas">Canvas &amp; export</h2>
        <div class="fields">
          <label class="field">
            <span data-i18n="field.size">Size</span>
            <select id="size-select" class="select"></select>
          </label>
          <label class="field">
            <span data-i18n="field.scale">Scale</span>
            <select id="scale-select" class="select"></select>
          </label>
        </div>
        <button id="export-btn" class="btn btn-primary btn-block" type="button">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-download"/></svg>
          <span data-i18n="export.button">Export PNG</span>
          <span id="export-size" class="btn-meta"></span>
        </button>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <a href="https://github.com/celaldrg/pixel-art">MIT · <span data-i18n="footer.source">Source on GitHub</span></a>
  </footer>
</body>
</html>
